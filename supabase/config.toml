# Supabase CLI project settings (only the parts this portal relies on).
# Each function verifies requests itself: public functions validate input and
# rate-limit; staff functions verify the caller's JWT with Supabase Auth and
# check their role in public.staff.

[functions.helpdesk]
verify_jwt = false

[functions.inkwell]
verify_jwt = false

[functions.publish-snapshot]
verify_jwt = false

[functions.staff-admin]
verify_jwt = false

[auth]
# Staff accounts are created by invitation only.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
secure_password_change = true
